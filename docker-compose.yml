version: '3.8'

services:
  ai-assistant:
    build: .
    image: ai-assistant
    container_name: ai-assistant-container
    restart: unless-stopped
    # --- Privileged access for hardware ---
    # This is required for direct hardware interaction.
    privileged: true
    devices:
      - "/dev/snd:/dev/snd"         # Mount sound devices for audio I/O
      - "/dev/gpiochip0:/dev/gpiochip0" # Mount GPIO device (for Raspberry Pi)
    # --- GUI Forwarding ---
    # This setup forwards the container's display to your host's display server.
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      # Pass the OpenAI API key as an environment variable
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    # --- Command to run ---
    # We will use the control_script.py as the entry point.
    # Note: The paths inside the script should be updated to match the container's WORKDIR (/app).
    command: ["python", "control_script.py"]